name: PR Validation

# Validates Terraform, scripts, and repository-managed runtime clients on PRs.
# Never applies infrastructure and never uses secrets.
on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/**"
      - "skills/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh

      - name: Python syntax and camera/security unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -p 'test_camera*.py'
          python3 -m unittest discover -s tests -p 'test_sanitize_wireguard.py'
