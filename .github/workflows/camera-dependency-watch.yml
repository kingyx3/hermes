name: Camera Dependency Watch

on:
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  go2rtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned go2rtc against latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/^GO2RTC_VERSION="\([^"]*\)"/\1/p' scripts/install-camera-runtime.sh)"
          LATEST="$(gh api repos/AlexxIT/go2rtc/releases/latest --jq '.tag_name' | sed 's/^v//')"
          [ -n "${CURRENT}" ] && [ -n "${LATEST}" ]
          if [ "${CURRENT}" = "${LATEST}" ]; then
            echo "go2rtc ${CURRENT} is current."
            exit 0
          fi
          TITLE="Camera dependency review: go2rtc ${LATEST} available"
          EXISTING="$(gh issue list --state open --search 'Camera dependency review: go2rtc in:title' --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Existing dependency-review issue #${EXISTING}; no duplicate created."
            exit 0
          fi
          gh issue create \
            --title "${TITLE}" \
            --body "The secure camera runtime pins go2rtc ${CURRENT}; upstream latest stable is ${LATEST}. Review release notes, update the pinned SHA-256 only after validation, and run PR security tests before merging."
